services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: home-app-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/home_app
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      MQTT_BROKER_URL: tcp://mqtt:1883
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mqtt

  postgres:
    image: postgres:16
    container_name: home-app-postgres
    environment:
      POSTGRES_DB: home_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    container_name: home-app-mqtt
    ports:
      - "1883:1883"

volumes:
  postgres_data:
