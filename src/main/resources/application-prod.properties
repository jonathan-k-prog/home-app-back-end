server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker-url=${MQTT_BROKER_URL}
mqtt.client-id=${MQTT_CLIENT_ID}
mqtt.topic=${MQTT_TOPIC}

weather.api-key=${WEATHER_API}
weather.base-url=${WEATHER_BASE_URL:https://api.weatherapi.com}
weather.location=${WEATHER_LOCATION}

google.client-id=${GOOGLE_CLIENT_ID}
auth.allowed-email=${AUTH_ALLOWED_EMAIL}
jwt.secret=${JWT_SECRET}

spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}